<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>浙江省 都市名クイズ</title>

<style>

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;

        font-family:
            "Noto Serif JP",
            "Yu Mincho",
            "Hiragino Mincho ProN",
            serif;

        color: #382d28;

        background:
            radial-gradient(circle at 20% 20%, rgba(180, 130, 70, 0.08), transparent 25%),
            radial-gradient(circle at 80% 70%, rgba(160, 40, 40, 0.06), transparent 25%),
            #f5efe2;
    }


    /* =========================
       全体
       ========================= */

    .page {
        width: 100%;
        max-width: 1000px;
        margin: 0 auto;
        padding: 30px 20px 50px;
    }


    /* =========================
       ヘッダー
       ========================= */

    .header {
        text-align: center;
        margin-bottom: 25px;
    }

    .seal {
        display: inline-flex;

        width: 58px;
        height: 58px;

        align-items: center;
        justify-content: center;

        margin-bottom: 10px;

        background: #a52d2d;
        color: #f9e8c7;

        border: 3px solid #8e2424;

        font-size: 24px;
        font-weight: bold;

        box-shadow:
            0 3px 8px rgba(80, 30, 20, 0.2);

        transform: rotate(-3deg);
    }

    h1 {
        margin: 5px 0 5px;

        font-size: 34px;
        letter-spacing: 0.15em;

        color: #8f2929;
    }

    .subtitle {
        color: #8b7564;
        font-size: 14px;
        letter-spacing: 0.15em;
    }


    /* =========================
       メインカード
       ========================= */

    .card {
        position: relative;

        background: rgba(255, 252, 244, 0.95);

        border: 1px solid #d8c4a4;

        box-shadow:
            0 10px 30px rgba(70, 40, 20, 0.12);

        padding: 25px;

        overflow: hidden;
    }

    /* 中国風の上下装飾 */

    .card::before,
    .card::after {
        content: "";

        position: absolute;

        left: 25px;
        right: 25px;

        height: 2px;

        background:
            linear-gradient(
                to right,
                transparent,
                #b48a4b 15%,
                #b48a4b 85%,
                transparent
            );
    }

    .card::before {
        top: 12px;
    }

    .card::after {
        bottom: 12px;
    }


    /* =========================
       説明
       ========================= */

    .description {
        text-align: center;

        margin: 5px 0 20px;

        color: #68594e;

        font-size: 16px;
        line-height: 1.8;
    }


    /* =========================
       地図
       ========================= */

    .map-container {

        width: 720px;
        max-width: 100%;

        margin: 0 auto 20px;

        position: relative;

        background:
            radial-gradient(
                circle,
                rgba(180, 150, 100, 0.08) 1px,
                transparent 1px
            );

        background-size: 12px 12px;

        padding: 10px;
    }


    svg {
        width: 100%;
        height: auto;
    }


    /* 浙江省 */

    .zhejiang {

        fill: #fffdf7;

        stroke: #a52d2d;

        stroke-width: 3;

        filter:
            drop-shadow(
                0px 4px 4px rgba(100, 50, 20, 0.12)
            );
    }


    /* =========================
       都市マーカー
       ========================= */

    .city-marker {

        position: absolute;

        transform:
            translate(-50%, -50%);

        width: 72px;
        min-height: 38px;

        display: flex;
        justify-content: center;
        align-items: center;

        background: #fffdf7;

        border:
            1px solid #9e8971;

        color: #4b4038;

        font-size: 16px;

        font-weight: bold;

        letter-spacing: 0.05em;

        box-shadow:
            0 3px 7px rgba(60, 40, 20, 0.12);

        transition: all 0.3s ease;

        border-radius: 3px;
    }


    /* 現在の問題 */

    .city-marker.current {

        border:
            3px solid #a52d2d;

        background: #fff7e6;

        color: #a52d2d;

        transform:
            translate(-50%, -50%)
            scale(1.12);

        box-shadow:
            0 0 0 4px rgba(165, 45, 45, 0.12),
            0 5px 12px rgba(100, 30, 20, 0.18);
    }


    /* 正解済み */

    .city-marker.correct {

        background: #f1ead9;

        border:
            2px solid #b48a4b;

        color: #8f2929;

        box-shadow:
            0 3px 8px rgba(80, 50, 20, 0.15);
    }


    /* =========================
       問題文
       ========================= */

    .question-box {

        text-align: center;

        margin: 10px 0 18px;
    }

    .question-label {

        font-size: 13px;

        color: #a68a67;

        letter-spacing: 0.2em;

        margin-bottom: 5px;
    }

    .question {

        font-size: 25px;

        font-weight: bold;

        color: #4a3329;
    }


    /* =========================
       回答欄
       ========================= */

    .answer-area {

        display: flex;

        justify-content: center;

        align-items: center;

        gap: 8px;

        margin-bottom: 10px;
    }

    input {

        width: 260px;

        padding: 12px 15px;

        font-family:
            "Noto Serif JP",
            "Yu Mincho",
            serif;

        font-size: 18px;

        color: #40352f;

        background: #fffdf8;

        border:
            1px solid #b9a487;

        border-radius: 3px;

        outline: none;

        transition: 0.2s;
    }

    input:focus {

        border-color: #a52d2d;

        box-shadow:
            0 0 0 3px rgba(165, 45, 45, 0.1);
    }


    /* =========================
       回答ボタン
       ========================= */

    button {

        padding: 12px 25px;

        font-family:
            "Noto Serif JP",
            "Yu Mincho",
            serif;

        font-size: 17px;

        border: none;

        border-radius: 3px;

        background: #a52d2d;

        color: #fff6e4;

        cursor: pointer;

        letter-spacing: 0.1em;

        box-shadow:
            0 3px 7px rgba(90, 30, 20, 0.2);

        transition: 0.2s;
    }

    button:hover {

        background: #8d2323;

        transform: translateY(-1px);
    }


    /* =========================
       結果
       ========================= */

    .result {

        height: 35px;

        margin-top: 8px;

        text-align: center;

        font-size: 20px;

        font-weight: bold;
    }

    .correct-text {

        color: #9a6b25;
    }

    .wrong-text {

        color: #a52d2d;
    }


    /* =========================
       進捗
       ========================= */

    .progress {

        text-align: center;

        margin-top: 5px;

        color: #8a7765;

        font-size: 14px;

        letter-spacing: 0.1em;
    }


    /* =========================
       完成画面
       ========================= */

    .complete {

        text-align: center;

        margin: 15px 0;

        color: #8f2929;

        font-size: 27px;

        font-weight: bold;
    }

    .complete-sub {

        text-align: center;

        color: #806c5c;

        margin-bottom: 15px;

        font-size: 15px;
    }

    .restart-button {

        display: block;

        margin: 0 auto 10px;

        background: #b48a4b;
    }

    .restart-button:hover {

        background: #967038;
    }


    /* =========================
       スマホ対応
       ========================= */

    @media (max-width: 600px) {

        .page {
            padding: 20px 10px 40px;
        }

        h1 {
            font-size: 26px;
        }

        .card {
            padding: 18px 10px;
        }

        .city-marker {
            width: 55px;
            min-height: 32px;
            font-size: 13px;
        }

        .answer-area {
            flex-direction: column;
        }

        input {
            width: 90%;
        }

        button {
            width: 160px;
        }

        .question {
            font-size: 22px;
        }
    }

</style>
</head>


<body>

<div class="page">

    <div class="header">

        <div class="seal">
            浙
        </div>

        <h1>浙江省 都市名クイズ</h1>

        <div class="subtitle">
            ZHEJIANG CITY QUIZ
        </div>

    </div>


    <div class="card">

        <div class="description">
            地図を見ながら、空欄に入る都市名を<br>
            中国語で答えてください。
        </div>


        <div class="map-container">

            <!-- 浙江省の大まかな形 -->

            <svg viewBox="0 0 700 650">

                <path
                    class="zhejiang"
                    d="
                    M180 80
                    L300 45
                    L410 70
                    L510 120
                    L590 190
                    L620 280
                    L590 360
                    L620 450
                    L550 520
                    L470 550
                    L380 600
                    L280 570
                    L200 520
                    L130 450
                    L110 350
                    L130 250
                    L150 170
                    Z
                    ">
                </path>

            </svg>


            <!-- 都市 -->

            <div
                id="city1"
                class="city-marker"
                style="left:48%; top:28%;">
                ①
            </div>

            <div
                id="city2"
                class="city-marker"
                style="left:31%; top:18%;">
                ②
            </div>

            <div
                id="city3"
                class="city-marker"
                style="left:48%; top:15%;">
                ③
            </div>

            <div
                id="city4"
                class="city-marker"
                style="left:55%; top:36%;">
                ④
            </div>

            <div
                id="city5"
                class="city-marker"
                style="left:69%; top:31%;">
                ⑤
            </div>

            <div
                id="city6"
                class="city-marker"
                style="left:46%; top:53%;">
                ⑥
            </div>

            <div
                id="city7"
                class="city-marker"
                style="left:82%; top:37%;">
                ⑦
            </div>

            <div
                id="city8"
                class="city-marker"
                style="left:28%; top:58%;">
                ⑧
            </div>

            <div
                id="city9"
                class="city-marker"
                style="left:72%; top:50%;">
                ⑨
            </div>

            <div
                id="city10"
                class="city-marker"
                style="left:65%; top:67%;">
                ⑩
            </div>

            <div
                id="city11"
                class="city-marker"
                style="left:43%; top:73%;">
                ⑪
            </div>

        </div>


        <!-- 問題 -->

        <div class="question-box">

            <div class="question-label">
                QUESTION
            </div>

            <div
                class="question"
                id="question">
                「①」の都市は？
            </div>

        </div>


        <!-- 回答 -->

        <div class="answer-area">

            <input
                type="text"
                id="answer"
                placeholder="中国語で入力"
                autocomplete="off"
            >

            <button onclick="checkAnswer()">
                回答
            </button>

        </div>


        <!-- 結果 -->

        <div
            class="result"
            id="result">
        </div>


        <!-- 進捗 -->

        <div
            class="progress"
            id="progress">
            0 / 11 正解
        </div>

    </div>

</div>


<script>

    /* =========================================
       浙江省の11都市
       ========================================= */

    const cities = [

        "杭州",
        "湖州",
        "嘉兴",
        "绍兴",
        "宁波",
        "金华",
        "舟山",
        "衢州",
        "台州",
        "温州",
        "丽水"

    ];


    /* =========================================
       ゲーム状態
       ========================================= */

    let currentQuestion = 0;

    let score = 0;


    /* =========================================
       問題を表示
       ========================================= */

    function updateQuestion() {

        document
            .querySelectorAll(".city-marker")
            .forEach(marker => {

                marker.classList.remove("current");

            });


        if (currentQuestion < cities.length) {

            const number =
                currentQuestion + 1;


            const currentMarker =
                document.getElementById(
                    "city" + number
                );


            currentMarker.classList.add(
                "current"
            );


            document.getElementById(
                "question"
            ).textContent =
                "「" + number + "」の都市は？";


            document.getElementById(
                "answer"
            ).value = "";


            document.getElementById(
                "answer"
            ).focus();


        } else {

            showComplete();

        }

    }


    /* =========================================
       正解チェック
       ========================================= */

    function checkAnswer() {

        const input =
            document
                .getElementById("answer")
                .value
                .trim();


        const correctAnswer =
            cities[currentQuestion];


        const result =
            document.getElementById("result");


        /* 正解 */

        if (input === correctAnswer) {

            result.textContent =
                "○ 正解！";

            result.className =
                "result correct-text";


            const marker =
                document.getElementById(
                    "city" + (currentQuestion + 1)
                );


            /* 空欄に都市名を入れる */

            marker.textContent =
                correctAnswer;


            /* 正解済みデザイン */

            marker.classList.remove(
                "current"
            );

            marker.classList.add(
                "correct"
            );


            score++;


            document.getElementById(
                "progress"
            ).textContent =
                score +
                " / " +
                cities.length +
                " 正解";


            currentQuestion++;


            /* 少し待って次へ */

            setTimeout(() => {

                result.textContent = "";

                updateQuestion();

            }, 700);


        } else {

            /* 不正解 */

            result.textContent =
                "× 不正解！もう一度！";

            result.className =
                "result wrong-text";

        }

    }


    /* =========================================
       全問正解
       ========================================= */

    function showComplete() {

        document.getElementById(
            "question"
        ).innerHTML =
            '<div class="complete">全問正解！</div>' +
            '<div class="complete-sub">' +
            '浙江省11都市、完全制覇です。' +
            '</div>';


        document.getElementById(
            "answer"
        ).style.display = "none";


        document.querySelector(
            ".answer-area button"
        ).style.display = "none";


        /* もう一度ボタンを作る */

        const restartButton =
            document.createElement("button");


        restartButton.textContent =
            "もう一度挑戦する";


        restartButton.className =
            "restart-button";


        restartButton.onclick =
            restartQuiz;


        document
            .querySelector(".answer-area")
            .appendChild(restartButton);

    }


    /* =========================================
       ゲームを最初からやり直す
       ========================================= */

    function restartQuiz() {

        currentQuestion = 0;

        score = 0;


        /* 都市マーカーを全部初期状態に戻す */

        cities.forEach((city, index) => {

            const marker =
                document.getElementById(
                    "city" + (index + 1)
                );


            marker.textContent =
                "①②③④⑤⑥⑦⑧⑨⑩⑪"
                    .charAt(0);


            /*
                上の処理では数字が正しく戻らないため、
                下で正式に設定する
            */

        });


        /* 数字を正しく復元 */

        for (
            let i = 0;
            i < cities.length;
            i++
        ) {

            const marker =
                document.getElementById(
                    "city" + (i + 1)
                );


            marker.textContent =
                numberToCircle(i + 1);


            marker.classList.remove(
                "correct"
            );

            marker.classList.remove(
                "current"
            );

        }


        /* 入力欄を復活 */

        document.getElementById(
            "answer"
        ).style.display = "block";


        /* 回答ボタンを復活 */

        document.querySelector(
            ".answer-area button"
        ).style.display = "block";


        /* 既存の再挑戦ボタンを削除 */

        const restartButton =
            document.querySelector(
                ".restart-button"
            );

        if (restartButton) {

            restartButton.remove();

        }


        /* スコアをリセット */

        document.getElementById(
            "progress"
        ).textContent =
            "0 / 11 正解";


        document.getElementById(
            "result"
        ).textContent = "";


        updateQuestion();

    }


    /* =========================================
       数字 → 丸数字
       ========================================= */

    function numberToCircle(number) {

        const circles = [
            "①",
            "②",
            "③",
            "④",
            "⑤",
            "⑥",
            "⑦",
            "⑧",
            "⑨",
            "⑩",
            "⑪"
        ];

        return circles[number - 1];

    }


    /* =========================================
       Enterキーで回答
       ========================================= */

    document
        .getElementById("answer")
        .addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {

                    checkAnswer();

                }

            }
        );


    /* =========================================
       最初の問題
       ========================================= */

    updateQuestion();

</script>

</body>
</html>
