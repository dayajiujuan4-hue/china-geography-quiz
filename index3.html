<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>中国地理クイズ 全国版</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background:
        radial-gradient(circle at top, #fff8e8 0%, #f5ead2 45%, #ead9b8 100%);
    color: #3b2418;
    font-family:
        "Noto Serif SC",
        "Songti SC",
        "Yu Mincho",
        serif;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 20px;
}

/* ヘッダー */

.header {
    text-align: center;
    margin-bottom: 20px;
}

.seal {
    display: inline-flex;
    align-items: center;
    justify-content: center;

    width: 70px;
    height: 70px;

    background: #b51f2a;
    color: white;

    font-size: 38px;
    font-weight: bold;

    border: 4px solid #8d1720;
    border-radius: 8px;

    box-shadow:
        3px 3px 0 #6e1219;

    transform: rotate(-3deg);

    margin-bottom: 10px;
}

h1 {
    margin: 5px 0;
    font-size: 32px;
}

.subtitle {
    color: #80664f;
    font-size: 15px;
}

/* ステータス */

.status {
    display: flex;
    justify-content: center;
    gap: 15px;
    flex-wrap: wrap;

    margin-bottom: 15px;
}

.status-box {
    background: rgba(255,255,255,0.65);

    border: 1px solid #c8a96b;
    border-radius: 10px;

    padding: 8px 18px;

    box-shadow: 0 2px 5px rgba(80,50,20,0.08);
}

.status-number {
    font-weight: bold;
    color: #a51d2d;
}

/* ゲーム */

.game-area {
    display: grid;
    grid-template-columns: 1fr 360px;
    gap: 20px;
}

/* 地図 */

.map-box {
    background: rgba(255,255,255,0.75);

    border: 2px solid #c5a15a;
    border-radius: 15px;

    padding: 15px;

    min-height: 600px;

    box-shadow:
        0 5px 15px rgba(60,40,20,0.12);
}

#map {
    width: 100%;
    height: 560px;
}

.province {
    fill: #f7f0df;
    stroke: #a88b55;
    stroke-width: 0.7;

    transition:
        fill 0.25s,
        stroke 0.25s;
}

.province.current {
    fill: #e9bd55;
    stroke: #9c6718;
    stroke-width: 2;
}

.province.correct {
    fill: #78b77c;
    stroke: #47794b;
    stroke-width: 1.2;
}

.province.failed {
    fill: #d9a0a0;
    stroke: #a64a4a;
    stroke-width: 1.2;
}

/* 回答エリア */

.quiz-box {
    background: rgba(255,255,255,0.82);

    border: 2px solid #c5a15a;
    border-radius: 15px;

    padding: 25px;

    height: fit-content;

    box-shadow:
        0 5px 15px rgba(60,40,20,0.12);
}

.question-label {
    color: #967346;
    font-size: 14px;
}

.question-number {
    font-size: 30px;
    font-weight: bold;
    color: #a51d2d;

    margin: 5px 0 20px;
}

.instruction {
    line-height: 1.8;
    margin-bottom: 15px;
}

.answer-input {
    width: 100%;

    padding: 13px;

    font-size: 18px;

    border:
        2px solid #c7ad7c;

    border-radius: 8px;

    outline: none;

    font-family:
        "Noto Serif SC",
        serif;

    background: #fffdf8;
}

.answer-input:focus {
    border-color: #a51d2d;
}

.answer-button {
    width: 100%;

    margin-top: 10px;

    padding: 13px;

    font-size: 17px;
    font-weight: bold;

    border: none;
    border-radius: 8px;

    background: #a51d2d;
    color: white;

    cursor: pointer;

    transition: 0.2s;
}

.answer-button:hover {
    background: #871722;
}

.message {
    min-height: 65px;

    margin-top: 18px;

    padding: 12px;

    border-radius: 8px;

    line-height: 1.6;

    text-align: center;
}

.message.correct-message {
    background: #e5f2e5;
    color: #35663a;
}

.message.wrong-message {
    background: #f8e5e2;
    color: #8d2525;
}

.message.help-message {
    background: #fff0cf;
    color: #805d1c;
}

/* 結果 */

.result {
    display: none;

    background: rgba(255,255,255,0.9);

    border: 2px solid #c5a15a;
    border-radius: 15px;

    padding: 30px;

    text-align: center;

    margin-top: 20px;
}

.result h2 {
    font-size: 30px;
    color: #a51d2d;
}

.result-number {
    font-size: 42px;
    font-weight: bold;

    color: #a51d2d;

    margin: 15px 0;
}

.result-detail {
    line-height: 2;
}

.failed-list {
    margin-top: 20px;

    padding: 15px;

    background: #f8eee0;

    border-radius: 10px;

    text-align: left;
}

.restart-button {
    margin-top: 20px;

    padding: 12px 30px;

    border: none;
    border-radius: 8px;

    background: #a51d2d;
    color: white;

    font-size: 16px;
    font-weight: bold;

    cursor: pointer;
}

.restart-button:hover {
    background: #871722;
}

/* スマホ */

@media (max-width: 800px) {

    .game-area {
        grid-template-columns: 1fr;
    }

    #map {
        height: 450px;
    }

    .map-box {
        min-height: auto;
    }

    h1 {
        font-size: 25px;
    }

    .quiz-box {
        padding: 20px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">

        <div class="seal">
            中
        </div>

        <h1>中国地理クイズ</h1>

        <div class="subtitle">
            全国34省级行政区挑战
        </div>

    </div>


    <!-- ステータス -->

    <div class="status">

        <div class="status-box">
            問題
            <span class="status-number" id="progress">
                1 / 34
            </span>
        </div>

        <div class="status-box">
            自力正解
            <span class="status-number" id="score">
                0
            </span>
        </div>

        <div class="status-box">
            残りミス
            <span class="status-number" id="mistakes">
                3
            </span>
        </div>

    </div>


    <!-- ゲーム -->

    <div class="game-area">

        <!-- 地図 -->

        <div class="map-box">

            <svg
                id="map"
                viewBox="0 0 1000 800"
                preserveAspectRatio="xMidYMid meet">
            </svg>

        </div>


        <!-- クイズ -->

        <div class="quiz-box">

            <div class="question-label">
                当前问题
            </div>

            <div class="question-number">
                <span id="questionNumber">1</span>
                / 34
            </div>

            <div class="instruction">

                地図上で黄色く表示されている地域の
                <strong>中国語名</strong>を入力してください。

            </div>

            <input
                id="answerInput"
                class="answer-input"
                type="text"
                placeholder="例：浙江省"
                autocomplete="off"
            >

            <button
                id="answerButton"
                class="answer-button">

                回答する

            </button>

            <div
                id="message"
                class="message">

            </div>

        </div>

    </div>


    <!-- 結果 -->

    <div
        id="result"
        class="result">

        <h2>
            全国34省級行政区 完走！
        </h2>

        <div class="result-number">
            <span id="finalScore">0</span>
            / 34
        </div>

        <div class="result-detail">

            自力で正解：
            <strong id="finalScoreText">0</strong> 問

            <br>

            3回ミスして答えを確認：
            <strong id="finalFailedText">0</strong> 問

            <br>

            自力正解率：
            <strong id="finalRate">0%</strong>

        </div>


        <div
            id="failedList"
            class="failed-list">

        </div>


        <button
            class="restart-button"
            onclick="restartGame()">

            もう一度挑戦する

        </button>

    </div>

</div>


<script>

/* =========================================================
   中国34省級行政区
========================================================= */

const provinces = [

    "北京市",
    "天津市",
    "河北省",
    "山西省",
    "内蒙古自治区",
    "辽宁省",
    "吉林省",
    "黑龙江省",

    "上海市",
    "江苏省",
    "浙江省",
    "安徽省",
    "福建省",
    "江西省",
    "山东省",

    "河南省",
    "湖北省",
    "湖南省",
    "广东省",
    "广西壮族自治区",
    "海南省",

    "重庆市",
    "四川省",
    "贵州省",
    "云南省",
    "西藏自治区",

    "陕西省",
    "甘肃省",
    "青海省",
    "宁夏回族自治区",
    "新疆维吾尔自治区",

    "香港特别行政区",
    "澳门特别行政区",
    "台湾省"

];


/* =========================================================
   状態
========================================================= */

let currentIndex = 0;

let score = 0;

let currentMistakes = 0;

let failedProvinces = [];

let geoData = null;


/* =========================================================
   地図読み込み
========================================================= */

async function loadMap() {

    try {

        const response =
            await fetch(
                "https://unpkg.com/cn-atlas@latest/provinces.json"
            );

        geoData = await response.json();

        drawMap();

        startQuestion();

    } catch (error) {

        document.getElementById("message").innerText =
            "地図の読み込みに失敗しました。";

        console.error(error);

    }

}


/* =========================================================
   GeoJSON → SVG
========================================================= */

function drawMap() {

    const svg =
        document.getElementById("map");

    svg.innerHTML = "";


    const features =
        geoData.features;


    features.forEach((feature, index) => {

        const path =
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "path"
            );


        const name =
            feature.properties.name;


        const d =
            geojsonToPath(
                feature.geometry
            );


        path.setAttribute(
            "d",
            d
        );


        path.classList.add(
            "province"
        );


        path.dataset.name =
            name;


        path.id =
            "province-" + index;


        svg.appendChild(path);

    });

}


/* =========================================================
   簡易GeoJSON変換
========================================================= */

function geojsonToPath(geometry) {

    let path = "";

    if (geometry.type === "Polygon") {

        geometry.coordinates.forEach(
            polygon => {

                polygon.forEach(
                    (point, i) => {

                        const x =
                            point[0] * 1000;

                        const y =
                            (90 - point[1]) * 10;

                        if (i === 0) {

                            path +=
                                `M ${x} ${y}`;

                        } else {

                            path +=
                                ` L ${x} ${y}`;

                        }

                    }
                );

                path += " Z";

            }
        );

    }


    if (geometry.type === "MultiPolygon") {

        geometry.coordinates.forEach(
            polygon => {

                polygon.forEach(
                    ring => {

                        ring.forEach(
                            (point, i) => {

                                const x =
                                    point[0] * 1000;

                                const y =
                                    (90 - point[1]) * 10;

                                if (i === 0) {

                                    path +=
                                        `M ${x} ${y}`;

                                } else {

                                    path +=
                                        ` L ${x} ${y}`;

                                }

                            }
                        );

                        path += " Z";

                    }
                );

            }
        );

    }


    return path;

}


/* =========================================================
   問題開始
========================================================= */

function startQuestion() {

    currentMistakes = 0;


    document.getElementById(
        "progress"
    ).innerText =
        `${currentIndex + 1} / ${provinces.length}`;


    document.getElementById(
        "questionNumber"
    ).innerText =
        currentIndex + 1;


    document.getElementById(
        "mistakes"
    ).innerText =
        3;


    document.getElementById(
        "answerInput"
    ).value = "";


    document.getElementById(
        "message"
    ).innerHTML = "";


    highlightCurrentProvince();


    document.getElementById(
        "answerInput"
    ).focus();

}


/* =========================================================
   現在の地域をハイライト
========================================================= */

function highlightCurrentProvince() {

    document
        .querySelectorAll(".province")
        .forEach(p => {

            p.classList.remove(
                "current"
            );

        });


    const target =
        provinces[currentIndex];


    document
        .querySelectorAll(".province")
        .forEach(p => {

            const name =
                p.dataset.name;

            if (
                name === target
            ) {

                p.classList.add(
                    "current"
                );

            }

        });

}


/* =========================================================
   回答判定
========================================================= */

function submitAnswer() {

    const input =
        document
            .getElementById(
                "answerInput"
            )
            .value
            .trim();


    if (!input) {

        return;

    }


    const correct =
        provinces[currentIndex];


    /* 正解 */

    if (input === correct) {

        score++;


        markCorrect(correct);


        document.getElementById(
            "message"
        ).className =
            "message correct-message";


        document.getElementById(
            "message"
        ).innerHTML =
            "○ 正解！";


        document.getElementById(
            "score"
        ).innerText =
            score;


        setTimeout(() => {

            nextQuestion();

        }, 700);


        return;

    }


    /* 不正解 */

    currentMistakes++;


    const remaining =
        3 - currentMistakes;


    document.getElementById(
        "mistakes"
    ).innerText =
        remaining;


    /* 3回目 */

    if (
        currentMistakes >= 3
    ) {

        failedProvinces.push(
            correct
        );


        document.getElementById(
            "message"
        ).className =
            "message help-message";


        document.getElementById(
            "message"
        ).innerHTML =
            `3回間違えました。<br>
             正解は <strong>${correct}</strong> です。`;


        markFailed(correct);


        setTimeout(() => {

            nextQuestion();

        }, 1800);


        return;

    }


    /* 1回目・2回目 */

    document.getElementById(
        "message"
    ).className =
        "message wrong-message";


    document.getElementById(
        "message"
    ).innerHTML =
        `× 不正解！<br>
         あと ${remaining} 回挑戦できます。`;


    document.getElementById(
        "answerInput"
    ).select();

}


/* =========================================================
   正解した地域
========================================================= */

function markCorrect(name) {

    document
        .querySelectorAll(".province")
        .forEach(p => {

            if (
                p.dataset.name === name
            ) {

                p.classList.remove(
                    "current"
                );

                p.classList.add(
                    "correct"
                );

            }

        });

}


/* =========================================================
   3回ミスした地域
========================================================= */

function markFailed(name) {

    document
        .querySelectorAll(".province")
        .forEach(p => {

            if (
                p.dataset.name === name
            ) {

                p.classList.remove(
                    "current"
                );

                p.classList.add(
                    "failed"
                );

            }

        });

}


/* =========================================================
   次の問題
========================================================= */

function nextQuestion() {

    currentIndex++;


    if (
        currentIndex >=
        provinces.length
    ) {

        finishGame();

        return;

    }


    startQuestion();

}


/* =========================================================
   ゲーム終了
========================================================= */

function finishGame() {

    document.querySelector(
        ".game-area"
    ).style.display =
        "none";


    document.querySelector(
        ".status"
    ).style.display =
        "none";


    const result =
        document.getElementById(
            "result"
        );


    result.style.display =
        "block";


    document.getElementById(
        "finalScore"
    ).innerText =
        score;


    document.getElementById(
        "finalScoreText"
    ).innerText =
        score;


    document.getElementById(
        "finalFailedText"
    ).innerText =
        failedProvinces.length;


    const rate =
        Math.round(
            score /
            provinces.length *
            100
        );


    document.getElementById(
        "finalRate"
    ).innerText =
        rate + "%";


    const failedList =
        document.getElementById(
            "failedList"
        );


    if (
        failedProvinces.length === 0
    ) {

        failedList.innerHTML =
            "全問自力正解です！全国制覇！";

    } else {

        failedList.innerHTML =
            "<strong>今回、3回間違えた地域</strong><br><br>" +
            failedProvinces.join("　");

    }

}


/* =========================================================
   リスタート
========================================================= */

function restartGame() {

    currentIndex = 0;

    score = 0;

    currentMistakes = 0;

    failedProvinces = [];


    document.getElementById(
        "score"
    ).innerText =
        "0";


    document.querySelector(
        ".game-area"
    ).style.display =
        "grid";


    document.querySelector(
        ".status"
    ).style.display =
        "flex";


    document.getElementById(
        "result"
    ).style.display =
        "none";


    document
        .querySelectorAll(".province")
        .forEach(p => {

            p.classList.remove(
                "current",
                "correct",
                "failed"
            );

        });


    startQuestion();

}


/* =========================================================
   ボタン
========================================================= */

document
    .getElementById(
        "answerButton"
    )
    .addEventListener(
        "click",
        submitAnswer
    );


/* Enterキー */

document
    .getElementById(
        "answerInput"
    )
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                submitAnswer();

            }

        }
    );


/* =========================================================
   起動
========================================================= */

loadMap();

</script>

</body>
</html>
